  <title>Un detalle para ti 🌸</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fdfbf7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =====================================
       RAMO
    ===================================== */

    .bouquet {
      position: relative;
      width: 380px;
      height: 390px;
      margin-bottom: 5px;
    }


    /* =====================================
       TALLOS
    ===================================== */

    .stem {
      position: absolute;
      bottom: 70px;
      left: 50%;

      width: 6px;
      height: 210px;

      background: linear-gradient(
        to right,
        #376b49,
        #65a873
      );

      border-radius: 10px;

      transform-origin: bottom center;

      z-index: 2;
    }

    .s1 {
      transform: translateX(-50%) rotate(-32deg);
    }

    .s2 {
      transform: translateX(-50%) rotate(-23deg);
    }

    .s3 {
      transform: translateX(-50%) rotate(-14deg);
    }

    .s4 {
      transform: translateX(-50%) rotate(-5deg);
    }

    .s5 {
      transform: translateX(-50%) rotate(5deg);
    }

    .s6 {
      transform: translateX(-50%) rotate(14deg);
    }

    .s7 {
      transform: translateX(-50%) rotate(23deg);
    }

    .s8 {
      transform: translateX(-50%) rotate(32deg);
    }


    /* =====================================
       HOJAS
    ===================================== */

    .leaf {
      position: absolute;

      width: 42px;
      height: 18px;

      background: #5d9b6a;

      border-radius: 100% 0 100% 0;

      z-index: 3;
    }

    .leaf1 {
      left: 85px;
      bottom: 135px;
      transform: rotate(-30deg);
    }

    .leaf2 {
      left: 115px;
      bottom: 115px;
      transform: rotate(25deg);
    }

    .leaf3 {
      right: 85px;
      bottom: 135px;
      transform: scaleX(-1) rotate(-30deg);
    }

    .leaf4 {
      right: 115px;
      bottom: 115px;
      transform: scaleX(-1) rotate(25deg);
    }


    /* =====================================
       FLORES GENERALES
    ===================================== */

    .flower {
      position: absolute;
      z-index: 8;
    }


    /* =====================================
       TULIPAN BLANCO
    ===================================== */

    .tulip {
      width: 52px;
      height: 65px;
    }

    .tulip-petal {
      position: absolute;

      top: 5px;

      width: 29px;
      height: 52px;

      background: linear-gradient(
        135deg,
        #ffffff,
        #eeeeee
      );

      border: 1px solid #dddddd;
    }

    .tulip-petal.left {
      left: 0;

      border-radius:
        18px
        5px
        20px
        20px;

      transform: rotate(-10deg);
    }

    .tulip-petal.center {
      left: 12px;
      top: 0;

      height: 56px;

      border-radius:
        15px
        15px
        20px
        20px;

      z-index: 2;
    }

    .tulip-petal.right {
      right: 0;

      border-radius:
        5px
        18px
        20px
        20px;

      transform: rotate(10deg);
    }

    .tulip-base {
      position: absolute;

      bottom: 0;
      left: 7px;

      width: 38px;
      height: 16px;

      background: #f5f5f5;

      border-radius:
        0
        0
        20px
        20px;
    }


    /* =====================================
       GERBERA ROSA
    ===================================== */

    .gerbera {
      width: 72px;
      height: 72px;
    }

    .petal {
      position: absolute;

      width: 22px;
      height: 39px;

      left: 25px;
      top: 1px;

      background: linear-gradient(
        to bottom,
        #ff9db5,
        #ff7194
      );

      border-radius:
        50%
        50%
        45%
        45%;

      transform-origin: 11px 35px;
    }

    .petal:nth-child(1) {
      transform: rotate(0deg);
    }

    .petal:nth-child(2) {
      transform: rotate(45deg);
    }

    .petal:nth-child(3) {
      transform: rotate(90deg);
    }

    .petal:nth-child(4) {
      transform: rotate(135deg);
    }

    .petal:nth-child(5) {
      transform: rotate(180deg);
    }

    .petal:nth-child(6) {
      transform: rotate(225deg);
    }

    .petal:nth-child(7) {
      transform: rotate(270deg);
    }

    .petal:nth-child(8) {
      transform: rotate(315deg);
    }

    .gerbera-center {

    /* =====================================
       CONO DE PAPEL
    ===================================== */

    .wrapper {
      position: absolute;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: 190px;
      height: 150px;

      background: #e2c4a8;

      clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
      );

      z-index: 6;

      box-shadow:
        0 5px 12px
        rgba(0,0,0,0.08);
    }


    /* =====================================
       DETALLE DEL PAPEL
    ===================================== */

    .wrapper::before {
      content: "";

      position: absolute;

      width: 100%;
      height: 100%;

      background:
        repeating-linear-gradient(
          -45deg,
          transparent 0px,
          transparent 12px,
          rgba(255,255,255,0.20) 13px,
          transparent 15px
        );
    }


    /* =====================================
       MOÑO
    ===================================== */

    .ribbon {
      position: absolute;

      left: 50%;
      bottom: 88px;

      transform: translateX(-50%);

      width: 58px;
      height: 20px;

      background: #ff85a1;

      border-radius: 12px;

      z-index: 12;

      box-shadow:
        0 3px 7px
        rgba(0,0,0,0.12);
    }

    .ribbon::before,
    .ribbon::after {
      content: "";

      position: absolute;

      top: -9px;

      width: 40px;
      height: 32px;

      background: #ff85a1;

      border-radius: 50%;
    }

    .ribbon::before {
      right: 38px;

      transform: rotate(25deg);
    }

    .ribbon::after {
      left: 38px;

      transform: rotate(-25deg);
    }


    /* =====================================
       BOTONES
    ===================================== */

    .btn {
      margin-top: 15px;

      padding: 14px 28px;

      font-size: 1.05rem;

      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          135deg,
          #ff758c,
          #ff7eb3
        );

      border: none;

      border-radius: 25px;

      box-shadow:
        0 6px 18px
        rgba(255,117,140,0.35);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 22px
        rgba(255,117,140,0.45);
    }

    .btn:active {
      transform: scale(0.96);
    }


    /* =====================================
       MENSAJES
    ===================================== */

    .card {
      margin-top: 15px;

      padding: 18px 24px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 8px 20px
        rgba(0,0,0,0.06);

      display: none;

      animation:
        aparecer
        0.4s ease;
    }

    .card h2 {
      font-size: 1.2rem;

      color: #2c3e50;

      line-height: 1.4;
    }


    @keyframes aparecer {

      from {
        opacity: 0;
        transform:
          translateY(10px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }


    /* =====================================
       CELULAR
    ===================================== */

    @media (max-width: 450px) {

      .bouquet {
        transform: scale(0.78);
        margin-bottom: -45px;
      }

      .card {
        max-width: 90%;
      }

    }

  </style>
</head>
