<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti 🌸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #faf5ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    /* Animación del Ramo */
    .img-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: scale(0.8) translateY(20px);
      animation: growBouquet 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .img-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes growBouquet {
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Estilo de Botones */
    .btn {
      margin-top: 25px;
      padding: 15px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border: none;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
      cursor: pointer;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.4s ease;
    }

    .btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Cuadros de Mensajes */
    .card {
      margin-top: 20px;
      padding: 20px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .card h2 {
      font-size: 1.3rem;
      color: #333;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="img-wrapper">
      <img src="https://lh3.googleusercontent.com/d/1w6v5d4uQf-4oJ0Qf" id="ramoImg" alt="Ramo de Tulipanes y Gerberas" onerror="this.src='https://images.unsplash.com/photo-1563245372-f21724e3856d?q=80&w=600&auto=format&fit=crop'">
    </div>

    <button id="btn1" class="btn">Presiona aquí</button>

    <div id="msg1" class="card">
      <h2>Me caes muy mal 😒</h2>
      <button id="btn2" class="btn visible" style="margin-top: 15px; background: linear-gradient(135deg, #6a11cb, #2575fc);">¿En serio? 🥺</button>
    </div>
