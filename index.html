<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Un detalle para ti 🌸</title>

<style>

/* =====================================
   CONFIGURACIÓN GENERAL
===================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    /* FONDO ROSITA */
    background:
        radial-gradient(
            circle at top,
            #ffeaf1,
            #ffd6e2 45%,
            #ffc4d4
        );

    overflow-x: hidden;
}

.contenedor {
    width: 100%;
    max-width: 430px;

    text-align: center;

    padding: 20px;
}


/* =====================================
   RAMO
===================================== */

.ramo {
    position: relative;

    width: 380px;
    height: 390px;

    margin: auto;
}


/* =====================================
   TALLOS
===================================== */

.tallo {
    position: absolute;

    width: 7px;
    height: 220px;

    background: #4f8b5c;

    border-radius: 10px;

    bottom: 80px;
    left: 50%;

    transform-origin: bottom center;

    z-index: 1;
}


/* Cada tallo */

.tallo1 {
    transform: translateX(-50%) rotate(-35deg);
}

.tallo2 {
    transform: translateX(-50%) rotate(-22deg);
}

.tallo3 {
    transform: translateX(-50%) rotate(-8deg);
}

.tallo4 {
    transform: translateX(-50%) rotate(8deg);
}

.tallo5 {
    transform: translateX(-50%) rotate(22deg);
}

.tallo6 {
    transform: translateX(-50%) rotate(35deg);
}

.tallo7 {
    transform: translateX(-50%) rotate(-15deg);
}

.tallo8 {
    transform: translateX(-50%) rotate(15deg);
}


/* =====================================
   HOJAS
===================================== */

.hoja {
    position: absolute;

    width: 45px;
    height: 20px;

    background: #65a96f;

    border-radius: 100% 0 100% 0;

    z-index: 2;
}

.hoja1 {
    left: 65px;
    bottom: 150px;

    transform: rotate(-30deg);
}

.hoja2 {
    left: 105px;
    bottom: 125px;

    transform: rotate(25deg);
}

.hoja3 {
    right: 65px;
    bottom: 150px;

    transform: scaleX(-1) rotate(-30deg);
}

.hoja4 {
    right: 105px;
    bottom: 125px;

    transform: scaleX(-1) rotate(25deg);
}


/* =====================================
   FLORES
===================================== */

.flor {
    position: absolute;

    z-index: 10;
}


/* =====================================
   TULIPÁN BLANCO
===================================== */

.tulipan {
    width: 55px;
    height: 65px;
}


/* Pétalos */

.tulipan .petalo {
    position: absolute;

    width: 30px;
    height: 55px;

    top: 5px;

    background: linear-gradient(
        135deg,
        #ffffff,
        #eeeeee
    );

    border: 1px solid #d9d9d9;
}


/* Pétalo izquierdo */

.tulipan .izquierdo {
    left: 0;

    border-radius:
        20px
        5px
        20px
        20px;

    transform: rotate(-10deg);
}


/* Pétalo central */

.tulipan .centro {
    left: 12px;

    top: 0;

    height: 58px;

    border-radius:
        18px
        18px
        20px
        20px;

    z-index: 3;
}


/* Pétalo derecho */

.tulipan .derecho {
    right: 0;

    border-radius:
        5px
        20px
        20px
        20px;

    transform: rotate(10deg);
}


/* Base */

.tulipan .base {
    position: absolute;

    left: 7px;
    bottom: 0;

    width: 40px;
    height: 15px;

    background: #f5f5f5;

    border-radius:
        0
        0
        20px
        20px;

    z-index: 4;
}


/* =====================================
   GERBERA ROSA
===================================== */

.gerbera {
    width: 75px;
    height: 75px;
}


/* Pétalos */

.gerbera .petalo {
    position: absolute;

    width: 23px;
    height: 40px;

    left: 26px;
    top: 0;

    background: #ff7fa1;

    border-radius:
        50%
        50%
        45%
        45%;

    transform-origin:
        11px
        37px;
}


/* 8 pétalos */

.gerbera .p1 {
    transform: rotate(0deg);
}

.gerbera .p2 {
    transform: rotate(45deg);
}

.gerbera .p3 {
    transform: rotate(90deg);
}

.gerbera .p4 {
    transform: rotate(135deg);
}

.gerbera .p5 {
    transform: rotate(180deg);
}

.gerbera .p6 {
    transform: rotate(225deg);
}

.gerbera .p7 {
    transform: rotate(270deg);
}

.gerbera .p8 {
    transform: rotate(315deg);
}


/* Centro */

.gerbera .centro {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 24px;
    top: 24px;

    background: #65402e;

    border:
        4px solid
        #ffc2d0;

    border-radius: 50%;

    z-index: 5;
}


/* =====================================
   POSICIONES
===================================== */


/* 1 TULIPÁN */

.flor1 {
    left: 10px;
    top: 120px;
}


/* 2 GERBERA */

.flor2 {
    left: 55px;
    top: 70px;
}


/* 3 TULIPÁN */

.flor3 {
    left: 100px;
    top: 45px;
}


/* 4 GERBERA */

.flor4 {
    left: 145px;
    top: 25px;
}


/* 5 TULIPÁN */

.flor5 {
    left: 195px;
    top: 25px;
}


/* 6 GERBERA */

.flor6 {
    left: 240px;
    top: 45px;
}


/* 7 TULIPÁN */

.flor7 {
    left: 285px;
    top: 70px;
}


/* 8 GERBERA */

.flor8 {
    left: 330px;
    top: 120px;
}


/* =====================================
   CONO DE PAPEL
===================================== */

/*
   IMPORTANTE:
   El cono se hace con un elemento
   rectangular y una punta separada.
*/

.papel {
    position: absolute;

    width: 190px;
    height: 105px;

    left: 50%;
    bottom: 70px;

    transform: translateX(-50%);

    background: #e5c5a8;

    z-index: 6;

    border-radius:
        8px
        8px
        0
        0;
}


/* Punta del cono */

.punta {
    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 95px solid transparent;
    border-right: 95px solid transparent;

    border-top: 95px solid #e5c5a8;

    z-index: 6;
}


/* Detalle del papel */

.papel::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    background:
        repeating-linear-gradient(
            -45deg,
            transparent,
            transparent 12px,
            rgba(255,255,255,0.18) 13px,
            transparent 15px
        );

    border-radius:
        8px
        8px
        0
        0;
}


/* =====================================
   MOÑO
===================================== */

.mono {
    position: absolute;

    left: 50%;
    bottom: 130px;

    transform: translateX(-50%);

    width: 65px;
    height: 22px;

    background: #ff7195;

    border-radius: 15px;

    z-index: 15;
}


/* Lados del moño */

.mono::before,
.mono::after {
    content: "";

    position: absolute;

    width: 45px;
    height: 32px;

    top: -5px;

    background: #ff7195;

    border-radius: 50%;
}


.mono::before {
    right: 42px;

    transform: rotate(25deg);
}


.mono::after {
    left: 42px;

    transform: rotate(-25deg);
}


/* =====================================
   BOTÓN
===================================== */

.boton {
    margin-top: 5px;

    padding: 14px 28px;

    border: none;

    border-radius: 30px;

    color: white;

    font-size: 17px;
    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #ff6f91,
            #ff8fab
        );

    box-shadow:
        0 7px 18px
        rgba(255,80,120,0.30);

    cursor: pointer;
}


.boton:hover {
    transform: translateY(-2px);
}


.boton:active {
    transform: scale(0.96);
}


/* =====================================
   MENSAJES
===================================== */

.tarjeta {
    display: none;

    margin: 15px auto 0;

    padding: 18px 25px;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.10);

    max-width: 330px;

    animation:
        aparecer
        0.4s ease;
}


.tarjeta h2 {
    color: #3b3b3b;

    font-size: 20px;

    line-height: 1.4;
}


@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =====================================
   CELULAR
===================================== */

@media (max-width: 450px) {

    .ramo {
        transform: scale(0.78);

        margin-top: -35px;
        margin-bottom: -40px;
    }

}


/* =====================================
   PANTALLAS MUY PEQUEÑAS
===================================== */

@media (max-width: 360px) {

    .ramo {
        transform: scale(0.68);

        margin-top: -55px;
        margin-bottom: -65px;
    }

}

</style>
</head>
