<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#faf9f6;
    font-family:Georgia,"Times New Roman",serif;
}


/* =========================================================
   FONDO
========================================================= */

.page{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,0,0,.025) 0 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,0,0,.018) 0 1px,
            transparent 1.5px
        ),
        #faf9f6;
}


/* =========================================================
   RAMO COMPLETO
========================================================= */

.bouquet{
    position:absolute;

    left:50%;
    top:2%;

    width:min(460px,92vw);
    height:40vh;

    min-height:285px;

    transform:translateX(-50%);

    opacity:0;

    animation:
        entradaRamo 1.5s .2s ease forwards;

    z-index:4;
}


@keyframes entradaRamo{

    from{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(-25px)
            scale(.9);
    }

    to{
        opacity:1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   MOVIMIENTO DEL RAMO
========================================================= */

.bouquet-svg{

    width:100%;
    height:100%;

    overflow:visible;

    transform-origin:
        50% 100%;

    animation:
        movimientoRamo 6s ease-in-out infinite;
}


@keyframes movimientoRamo{

    0%,
    100%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(.7deg);
    }
}


/* =========================================================
   MOVIMIENTO INDIVIDUAL DE FLORES
========================================================= */

.flower-move{
    transform-box:fill-box;
    transform-origin:center bottom;

    animation:
        movimientoFlor 5s ease-in-out infinite;
}


.flower-move:nth-of-type(2){
    animation-delay:.5s;
}

.flower-move:nth-of-type(3){
    animation-delay:1s;
}

.flower-move:nth-of-type(4){
    animation-delay:.8s;
}

.flower-move:nth-of-type(5){
    animation-delay:1.4s;
}

.flower-move:nth-of-type(6){
    animation-delay:.3s;
}


@keyframes movimientoFlor{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-2px);
    }
}


/* =========================================================
   FRASE
========================================================= */

.collage{

    position:absolute;

    left:50%;
    top:44%;

    width:min(680px,95vw);

    transform:translateX(-50%);

    text-align:center;

    opacity:0;

    animation:
        mostrarFrase 1s 1.6s ease forwards;

    z-index:10;
}


@keyframes mostrarFrase{

    to{
        opacity:1;
    }
}


/* =========================================================
   PALABRAS
========================================================= */

.word{

    display:flex;

    justify-content:center;
    align-items:center;

    gap:4px;

    margin:
        2px 0 7px;
}


/* =========================================================
   LETRAS
========================================================= */

.letter{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:42px;
    height:58px;

    padding:2px 4px;

    font-size:
        clamp(
            40px,
            6.5vw,
            64px
        );

    line-height:1;

    position:relative;

    color:#8c174a;

    animation:
        entradaLetra .55s ease both;
}


.letter:nth-child(2n){
    color:#c43d62;
}

.letter:nth-child(3n){
    color:#18151b;
}

.letter:nth-child(4n){
    color:#e45b86;
}

.letter:nth-child(5n){
    color:#81304b;
}


.letter:nth-child(1){
    transform:rotate(-7deg);
}

.letter:nth-child(2){
    transform:
        rotate(3deg)
        translateY(3px);
}

.letter:nth-child(3){
    transform:rotate(-2deg);
}

.letter:nth-child(4){
    transform:
        rotate(5deg)
        translateY(-2px);
}

.letter:nth-child(5){
    transform:rotate(-4deg);
}

.letter:nth-child(6){
    transform:rotate(2deg);
}

.letter:nth-child(7){
    transform:rotate(-5deg);
}

.letter:nth-child(8){
    transform:rotate(4deg);
}


@keyframes entradaLetra{

    from{
        opacity:0;

        transform:
            translateY(20px)
            rotate(0deg)
            scale(.8);
    }

    to{
        opacity:1;
    }
}


/* =========================================================
   PAPEL DETRÁS DE LAS LETRAS
========================================================= */

.cut{

    position:absolute;

    inset:3px;

    z-index:-1;

    background:
        rgba(216,117,142,.15);

    border:
        1px solid
        rgba(140,23,74,.08);
}


/* =========================================================
   TEXTO PEQUEÑO
========================================================= */

.sub{

    margin-top:8px;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:
        clamp(
            19px,
            3.5vw,
            30px
        );

    color:#ad6373;

    letter-spacing:1px;
}


/* =========================================================
   BOTÓN
========================================================= */

button{

    position:absolute;

    bottom:5%;
    left:50%;

    transform:
        translateX(-50%);

    border:0;

    border-radius:999px;

    padding:
        13px 25px;

    font-size:16px;

    color:white;

    background:#b94c70;

    box-shadow:
        0 8px 25px
        rgba(125,42,70,.22);

    cursor:pointer;

    transition:.25s;

    z-index:20;
}


button:hover{

    transform:
        translateX(-50%)
        scale(1.05);
}


.hidden{

    opacity:0 !important;

    pointer-events:none;
}


/* =========================================================
   REVELAR
========================================================= */

.reveal .collage{

    animation:
        revelar .8s ease forwards;
}


@keyframes revelar{

    from{

        opacity:0;

        transform:
            translateX(-50%)
            translateY(20px);
    }

    to{

        opacity:1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    .bouquet{

        top:1%;

        min-height:240px;

<script>

/* =========================================================

========================================================= */

const page =
    document.getElementById("page");

const collage =
    document.getElementById("collage");

const btn =
    document.getElementById("btn");


/* =========================================================
   BOTÓN
========================================================= */

btn.addEventListener(
    "click",
    () => {

        collage.classList.remove(
            "hidden"
        );

        page.classList.add(
            "reveal"
        );

        btn.textContent =
            "♡";

        btn.style.opacity =
            ".55";


        setTimeout(
            () => {

                btn.classList.add(
                    "hidden"
                );

            },
            900
        );

    }
);
