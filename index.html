<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti may 🌸</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fdfbf7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    /* Animación del Ramo SVG */
    .bouquet-svg {
      width: 100%;
      max-width: 320px;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08));
    }

    /* Tallos creciendo */
    .stem {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: drawStem 1.6s ease-in-out forwards;
    }

    /* Flores y envoltorio floreciendo */
    .bloom {
      transform-origin: center;
      transform: scale(0);
      animation: popBloom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Tiempos de aparición progresiva */
    .d-stem { animation-delay: 0.2s; }
    .d-wrap { animation-delay: 1.0s; }
    .d-tulip1 { animation-delay: 1.3s; }
    .d-tulip2 { animation-delay: 1.5s; }
    .d-tulip3 { animation-delay: 1.7s; }
    .d-gerbera1 { animation-delay: 2.0s; }
    .d-gerbera2 { animation-delay: 2.2s; }

    @keyframes drawStem {
      to { stroke-dashoffset: 0; }
    }

    @keyframes popBloom {
      to { transform: scale(1); }
    }

    /* Botones */
    .btn {
      margin-top: 25px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border: none;
      border-radius: 25px;
      box-shadow: 0 6px 18px rgba(255, 117, 140, 0.35);
      cursor: pointer;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.3s ease;
    }

    .btn.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Tarjetas de Mensajes */
    .card {
      margin-top: 20px;
      padding: 18px 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      display: none;
      animation: popBloom 0.4s ease forwards;
    }

    .card h2 {
      font-size: 1.2rem;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ramo de Tulipanes Blancos y Gerberas Rosas -->
    <svg class="bouquet-svg" viewBox="0 0 350 450">
      <!-- Tallos Greens -->
      <g stroke-linecap="round">
        <path class="stem d-stem" d="M 175 410 Q 130 260 95 180" stroke="#4a7c59" stroke-width="6" fill="none"/>
        <path class="stem d-stem" d="M 175 410 Q 220 260 255 180" stroke="#4a7c59" stroke-width="6" fill="none"/>
        <path class="stem d-stem" d="M 175 410 Q 155 240 135 130" stroke="#3b6346" stroke-width="7" fill="none"/>
        <path class="stem d-stem" d="M 175 410 Q 195 240 215 130" stroke="#3b6346" stroke-width="7" fill="none"/>
        <path class="stem d-stem" d="M 175 410 Q 175 230 175 100" stroke="#4a7c59" stroke-width="8" fill="none"/>
      </g>

      <!-- Envoltorio de Papel y Moño -->
      <g class="bloom d-wrap">
        <polygon points="105,330 175,430 245,330 220,260 130,260" fill="#e2c4a8" stroke="#cbb094" stroke-width="2"/>
        <path d="M 145 290 Q 175 305 205 290 Q 175 275 145 290" fill="#ff85a1"/>
      </g>

      <!-- Tulipanes Blancos -->
      <!-- Tulipán Izquierda -->
      <g class="bloom d-tulip1" transform="translate(95, 175)">
        <path d="M -18 0 C -30 -25 -12 -50 0 -40 C 12 -50 30 -25 18 0 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
        <path d="M -8 0 C -15 -20 0 -35 0 -35 C 0 -35 15 -20 8 0 Z" fill="#f5f5f5"/>
      </g>

      <!-- Tulipán Centro Superior -->
      <g class="bloom d-tulip2" transform="translate(175, 95)">
        <path d="M -20 0 C -32 -28 -14 -55 0 -45 C 14 -55 32 -28 20 0 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
        <path d="M -10 0 C -18 -22 0 -38 0 -38 C 0 -22 18 -22 10 0 Z" fill="#f5f5f5"/>
      </g>

      <!-- Tulipán Derecha -->
      <g class="bloom d-tulip3" transform="translate(255, 175)">
        <path d="M -18 0 C -30 -25 -12 -50 0 -40 C 12 -50 30 -25 18 0 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
        <path d="M -8 0 C -15 -20 0 -35 0 -35 C 0 -35 15 -20 8 0 Z" fill="#f5f5f5"/>
      </g>

      <!-- Gerberas Rosas -->
      <!-- Gerbera Izquierda -->
      <g class="bloom d-gerbera1" transform="translate(135, 130)">
        <g fill="#ff85a1">
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(0)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(30)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(60)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(90)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(120)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(150)"/>
        </g>
        <circle cx="0" cy="0" r="10" fill="#ffc2d0"/>
        <circle cx="0" cy="0" r="6" fill="#5c3d2e"/>
      </g>

      <!-- Gerbera Derecha -->
      <g class="bloom d-gerbera2" transform="translate(215, 130)">
        <g fill="#ff758c">
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(15)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(45)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(75)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(105)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(135)"/>
          <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(165)"/>
        </g>
        <circle cx="0" cy="0" r="10" fill="#ffb3c1"/>
        <circle cx="0" cy="0" r="6" fill="#5c3d2e"/>
      </g>
    </svg>

    <!-- Botón 1 -->
    <button id="btn1" class="btn">Presiona aquí</button>

    <!-- Mensaje 1 -->
    <div id="msg1" class="card">
      <h2>Me caes muy mal </h2>
      <button id="btn2" class="btn visible" style="margin-top: 15px; background: linear-gradient(135deg, #4facfe, #00f2fe);">¿En serio? 🥺</button>
    </div>

    <!-- Mensaje 2 (Final) -->
    <div id="msg2" class="card">
      <h2>no es cierto  me caes muy bien may 🌸</h2>
    </div>
  </div>

  <script>
    const btn1 = document.getElementById('btn1');
    const btn2 = document.getElementById('btn2');
    const msg1 = document.getElementById('msg1');
    const msg2 = document.getElementById('msg2');

    // Muestra el botón cuando concluye la animación de floración (2.5 segundos)
    setTimeout(() => {
      btn1.classList.add('visible');
    }, 2500);

    btn1.addEventListener('click', () => {
      btn1.style.display = 'none';
      msg1.style.display = 'block';
    });

    btn2.addEventListener('click', () => {
      msg1.style.display = 'none';
      msg2.style.display = 'block';
    });
  </script>
</body>
</html>
