<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle para ti 🌸</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fdfbf7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* =========================================
       RAMO
    ========================================= */

    .bouquet {
      position: relative;
      width: 300px;
      height: 350px;
      margin-bottom: 15px;
    }

    /* =========================================
       TALLOS
    ========================================= */

    .stem {
      position: absolute;
      bottom: 55px;
      left: 50%;
      width: 7px;
      height: 190px;
      background: linear-gradient(to right, #376b49, #5d9b6a);
      border-radius: 10px;
      transform-origin: bottom center;
      z-index: 2;
    }

    .s1 {
      transform: translateX(-50%) rotate(-27deg);
    }

    .s2 {
      transform: translateX(-50%) rotate(-14deg);
    }

    .s3 {
      transform: translateX(-50%) rotate(0deg);
    }

    .s4 {
      transform: translateX(-50%) rotate(14deg);
    }

    .s5 {
      transform: translateX(-50%) rotate(27deg);
    }

    /* =========================================
       HOJAS
    ========================================= */

    .leaf {
      position: absolute;
      width: 35px;
      height: 15px;
      background: #5d9b6a;
      border-radius: 100% 0 100% 0;
      z-index: 3;
    }

    .leaf1 {
      left: 73px;
      bottom: 130px;
      transform: rotate(-30deg);
    }

    .leaf2 {
      left: 188px;
      bottom: 125px;
      transform: rotate(30deg) scaleX(-1);
    }

    .leaf3 {
      left: 120px;
      bottom: 105px;
      transform: rotate(-20deg);
    }

    /* =========================================
       FLORES
    ========================================= */

    .flower {
      position: absolute;
      z-index: 8;
    }

    /* =========================================
       TULIPÁN
    ========================================= */

    .tulip {
      width: 52px;
      height: 58px;
      position: absolute;
    }

    .tulip-petal {
      position: absolute;
      top: 5px;
      width: 27px;
      height: 48px;
      background: linear-gradient(
        135deg,
        #ffffff,
        #f1f1f1
      );
      border: 1px solid #dddddd;
    }

    .tulip-petal.left {
      left: 1px;
      border-radius: 18px 5px 20px 20px;
      transform: rotate(-10deg);
    }

    .tulip-petal.center {
      left: 13px;
      top: 0;
      height: 52px;
      border-radius: 14px 14px 18px 18px;
      z-index: 2;
    }

    .tulip-petal.right {
      right: 1px;
      border-radius: 5px 18px 20px 20px;
      transform: rotate(10deg);
    }

    .tulip-base {
      position: absolute;
      bottom: 0;
      left: 7px;
      width: 38px;
      height: 15px;
      background: #f5f5f5;
      border-radius: 0 0 20px 20px;
    }

    /* =========================================
       GERBERA
    ========================================= */

    .gerbera {
      width: 70px;
      height: 70px;
    }

    .petal {
      position: absolute;
      width: 23px;
      height: 38px;
      background: #ff85a1;
      border-radius: 50% 50% 45% 45%;
      left: 23px;
      top: 1px;
      transform-origin: 12px 34px;
    }

    .petal:nth-child(1) {
      transform: rotate(0deg);
    }

    .petal:nth-child(2) {
      transform: rotate(45deg);
    }

    .petal:nth-child(3) {
      transform: rotate(90deg);
    }

    .petal:nth-child(4) {
      transform: rotate(135deg);
    }

    .petal:nth-child(5) {
      transform: rotate(180deg);
    }

    .petal:nth-child(6) {
      transform: rotate(225deg);
    }

    .petal:nth-child(7) {
      transform: rotate(270deg);
    }

    .petal:nth-child(8) {
      transform: rotate(315deg);
    }

    .gerbera-center {
      position: absolute;
      width: 25px;
      height: 25px;
      left: 22px;
      top: 22px;
      background: radial-gradient(
        circle,
        #7b4b35 20%,
        #5c3d2e 70%
      );
      border: 3px solid #ffc2d0;
      border-radius: 50%;
      z-index: 5;
    }

    /* =========================================
       POSICIONES DE LAS FLORES
    ========================================= */

    .f1 {
      top: 105px;
      left: 25px;
    }

    .f2 {
      top: 70px;
      left: 78px;
    }

    .f3 {
      top: 45px;
      left: 125px;
    }

    .f4 {
      top: 70px;
      left: 175px;
    }

    .f5 {
      top: 105px;
      left: 220px;
    }

    /* =========================================
       PAPEL DEL RAMO
    ========================================= */

    .wrapper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 180px solid #e2c4a8;

      z-index: 6;
    }

    /* Borde decorativo del papel */

    .wrapper::after {
      content: '';
      position: absolute;

      left: -90px;
      bottom: -180px;

      width: 180px;
      height: 180px;

      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 12px,
        rgba(255,255,255,0.18) 13px,
        transparent 15px
      );

      clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
      );
    }

    /* =========================================
       MOÑO
    ========================================= */

    .ribbon {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 18px;
      background: #ff85a1;
      border-radius: 12px;
      z-index: 12;
      box-shadow: 0 3px 7px rgba(0,0,0,0.12);
    }

    .ribbon::before,
    .ribbon::after {
      content: '';
      position: absolute;
      top: -10px;
      width: 38px;
      height: 30px;
      background: #ff85a1;
      border-radius: 50%;
    }

    .ribbon::before {
      right: 35px;
      transform: rotate(25deg);
    }

    .ribbon::after {
      left: 35px;
      transform: rotate(-25deg);
    }

    /* =========================================
       BOTONES
    ========================================= */

    .btn {
      margin-top: 15px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;

      background: linear-gradient(
        135deg,
        #ff758c,
        #ff7eb3
      );

      border: none;
      border-radius: 25px;

      box-shadow:
        0 6px 18px rgba(255, 117, 140, 0.35);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 22px rgba(255, 117, 140, 0.45);
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* =========================================
       TARJETAS
    ========================================= */

    .card {
      margin-top: 15px;
      padding: 18px 24px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.06);

      display: none;

      animation: aparecer 0.4s ease;
    }

    .card h2 {
      font-size: 1.2rem;
      color: #2c3e50;
      line-height: 1.4;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================
       CELULAR
    ========================================= */

    @media (max-width: 450px) {

      .bouquet {
        transform: scale(0.88);
        margin-bottom: -10px;
      }

      .card {
        max-width: 90%;
      }

    }

  </style>
</head>

<body>
